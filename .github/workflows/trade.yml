name: trade
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: trade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trading cycle
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python -m trader.run
      - name: Save results for the dashboard
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push origin main
